<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Amirreza Sokhankhosh — Machine Learning Engineer</title>
    <meta
      name="description"
      content="Machine Learning Engineer specialized in ML, Gen AI, and distributed AI — building production-scale AI applications and scalable ML infrastructure."
    />

    <!-- Social previews. og:url and og:image MUST be absolute for Slack,
         LinkedIn, and iMessage to resolve them — update the domain below
         once this is deployed. -->
    <link rel="canonical" href="https://example.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://example.com/" />
    <meta
      property="og:title"
      content="Amirreza Sokhankhosh — Machine Learning Engineer"
    />
    <meta
      property="og:description"
      content="Machine Learning Engineer specialized in ML, Gen AI, and distributed AI — building production-scale AI applications and scalable ML infrastructure."
    />
    <meta property="og:image" content="https://example.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Amirreza Sokhankhosh, machine learning engineer, Toronto, Canada."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Amirreza Sokhankhosh — Machine Learning Engineer"
    />
    <meta
      name="twitter:description"
      content="Machine Learning Engineer specialized in ML, Gen AI, and distributed AI — building production-scale AI applications and scalable ML infrastructure."
    />
    <meta name="twitter:image" content="https://example.com/og.jpg" />

    <script>
      // Applies the stored theme before first paint so there is no flash.
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark =
            stored === 'dark' ||
            ((stored === 'system' || !stored) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
